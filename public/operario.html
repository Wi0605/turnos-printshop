<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Operario - Turnos Print Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header Operario -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          <h1 class="text-2xl font-black text-slate-800 tracking-tight">Panel de Operario</h1>
        </div>
        <p class="text-slate-500 text-xs sm:text-sm">Gestión de turnos y atención al cliente en mostrador</p>
      </div>

      <!-- Accesos Rápidos -->
      <div class="flex items-center gap-2">
        <a href="/tv" target="_blank" class="text-xs font-semibold px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition flex items-center gap-1.5 border border-slate-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-cyan-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          Abrir TV
        </a>
        <a href="/" target="_blank" class="text-xs font-semibold px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition flex items-center gap-1.5 border border-slate-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
          </svg>
          Abrir Tótem
        </a>
      </div>
    </header>

    <!-- Controles y Estado -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- Tarjeta Turno Actual -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Atendiendo Ahora</h2>
            <span id="badge-atendiendo" class="hidden text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">En curso</span>
          </div>

          <div id="turno-actual-box" class="text-center py-6">
            <p class="text-slate-400 text-sm">Ningún turno en atención</p>
          </div>
        </div>

        <!-- Botones de Acción de Turno -->
        <div class="space-y-2 pt-4 border-t border-slate-100">
          <button id="btn-rellamar" onclick="rellamarTurno()" class="hidden w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            Re-llamar en TV
          </button>
          <button id="btn-completar" onclick="completarTurno()" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            Finalizar Atención
          </button>
          <button onclick="llamarSiguiente()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 text-base">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
            </svg>
            Llamar Siguiente
          </button>
        </div>
      </div>

      <!-- Tarjeta Cola de Espera -->
      <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
          <div>
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Turnos en Espera</h2>
            <p class="text-xs text-slate-400">Orden de llegada en tiempo real</p>
          </div>
          <span id="contador-espera" class="bg-indigo-50 text-indigo-700 font-extrabold px-3 py-1 rounded-full text-xs border border-indigo-100">
            0 en cola
          </span>
        </div>

        <div id="lista-espera" class="space-y-2.5 flex-1 overflow-y-auto max-h-[420px] pr-1">
          <p class="text-slate-400 text-sm py-8 text-center">No hay clientes esperando</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    const socket = io();

    const CATEGORIA_BADGES = {
      A: 'bg-cyan-100 text-cyan-800 border-cyan-200',
      B: 'bg-indigo-100 text-indigo-800 border-indigo-200',
      C: 'bg-amber-100 text-amber-800 border-amber-200',
      D: 'bg-emerald-100 text-emerald-800 border-emerald-200'
    };

    socket.on('actualizar_estado', ({ turnos, turnoActual }) => {
      const boxActual = document.getElementById('turno-actual-box');
      const badgeAtendiendo = document.getElementById('badge-atendiendo');
      const btnRellamar = document.getElementById('btn-rellamar');
      const btnCompletar = document.getElementById('btn-completar');

      if (turnoActual) {
        badgeAtendiendo.classList.remove('hidden');
        btnRellamar.classList.remove('hidden');
        btnCompletar.classList.remove('hidden');

        boxActual.innerHTML = `
          <div class="text-6xl font-black text-indigo-600 font-mono-code mb-2">${turnoActual.codigo}</div>
          <div class="font-bold text-slate-800 text-lg">${turnoActual.servicio}</div>
          <div class="text-xs text-slate-400 mt-2 font-mono">Llegada: ${turnoActual.hora}</div>
        `;
      } else {
        badgeAtendiendo.classList.add('hidden');
        btnRellamar.classList.add('hidden');
        btnCompletar.classList.add('hidden');
        boxActual.innerHTML = `<p class="text-slate-400 text-sm py-6">Ningún turno en atención</p>`;
      }

      const lista = document.getElementById('lista-espera');
      document.getElementById('contador-espera').innerText = `${turnos.length} en cola`;
      lista.innerHTML = '';

      if (turnos.length === 0) {
        lista.innerHTML = `<p class="text-slate-400 text-sm py-8 text-center">No hay clientes esperando</p>`;
        return;
      }

      turnos.forEach((t, i) => {
        const cat = t.codigo.charAt(0);
        const badgeColor = CATEGORIA_BADGES[cat] || 'bg-slate-100 text-slate-800 border-slate-200';

        const item = document.createElement('div');
        item.className = 'flex justify-between items-center p-3.5 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200/70 transition';
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 font-bold text-xs flex items-center justify-center">${i + 1}</span>
            <span class="px-2 py-0.5 rounded-md font-mono-code font-bold text-sm border ${badgeColor}">${t.codigo}</span>
            <span class="text-sm font-semibold text-slate-700">${t.servicio}</span>
          </div>
          <span class="text-xs text-slate-400 font-mono">${t.hora}</span>
        `;
        lista.appendChild(item);
      });
    });

    function llamarSiguiente() {
      socket.emit('llamar_siguiente');
    }

    function rellamarTurno() {
      socket.emit('rellamar_turno');
    }

    function completarTurno() {
      socket.emit('completar_turno');
    }
  </script>
</body>
</html>
